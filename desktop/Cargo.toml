[package]
name = "wkbd-desktop"
version = "0.1.0"
edition = "2021"
publish = false

# Its own workspace, deliberately. Tauri pulls in a large dependency tree and a build script that
# needs a webview toolkit present; folding that into the root workspace would make `cargo test` for
# the daemon depend on GTK development headers being installed, which is a poor trade for a crate
# that contains no logic.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[workspace]
resolver = "2"
members = [
    "crates/wkbd-proto",
    "crates/wkbd-store",
    "crates/wkbd-vcs",
    "crates/wkbd-sec",
    "crates/wkbd-agent",
    "crates/wkbd-memory",
    "crates/wkbd-orch",
    "crates/wkbd-evolve",
    "crates/wkbd-core",
    "crates/fake-acp-agent",
    "crates/acp-probe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Agent Client Protocol. Pinned to the crate line that targets protocol version 1;
# `unstable_protocol_v2` is deliberately NOT enabled. Upstream's own warning is that
# wire compatibility must not be inferred from the crate version, so the negotiated
# `protocolVersion` is the only thing we branch on at runtime.
agent-client-protocol = "2.0"

anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

wkbd-proto = { path = "crates/wkbd-proto" }
wkbd-store = { path = "crates/wkbd-store" }
wkbd-vcs = { path = "crates/wkbd-vcs" }
wkbd-sec = { path = "crates/wkbd-sec" }
wkbd-agent = { path = "crates/wkbd-agent" }
wkbd-memory = { path = "crates/wkbd-memory" }
wkbd-orch = { path = "crates/wkbd-orch" }
wkbd-evolve = { path = "crates/wkbd-evolve" }

[profile.release]
# Panics in the daemon must not abort the process: the daemon owns every agent
# subprocess, and an abort would orphan all of them. See wkbd-sec::reaper for the
# cleanup that only runs if we unwind rather than abort.
panic = "unwind"
